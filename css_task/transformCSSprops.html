<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            width: 300px;
            height: 300px;

            transform: translate(550px, 550px);
            transform: translateX(200px);
            transform: translateY(200px);

            transform: rotate(20deg);
            transform: rotateX(75deg);
            transform: rotateY(75deg);

            transform: skew(30deg, 15deg);
            transform: skewX(45deg);
            transform: skewY(35deg);

            transform: scale(1, 1);
            transform: scaleX(3);
            transform: scaleY(3);

        }
    </style>
</head>
<body>
    <img src="https://media.istockphoto.com/id/585613602/photo/close-up-cute-meerkat-animal-relaxing-in-the-dessert.jpg?s=1024x1024&w=is&k=20&c=c3CmUHsgU_L6dgJZAH4OCPAGH_ElCOFKHEkz8_9_yq4=" alt="">
</body>
</html>
