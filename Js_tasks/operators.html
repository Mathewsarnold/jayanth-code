<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        // ARITHMETIC OPERATOR
        let a = 50;
        let b = 30;

        console.log(a + b);
        console.log(a - b);
        console.log(a * b);
        console.log(a / b);

        let c = 3;
        let d = 2;

        console.log(c*d);
        console.log(c**d);

        let e = 4;
        let f = 2;

        console.log(e*f);
        console.log(e**f);

        // COMAPRISON OR RELATIONAL OPERATOR 
        let ab = 200;
        let ba = 100;

        console.log(ab > ba);
        console.log(ba >= ba);
        console.log(ba != ba);
        console.log(ba <= ba);
        console.log(ab == ba);
        
        // LOGICAL OPERATOR
        let ac = 300;
        let cc = 450;

        console.log(ac);

        // AND OPERATOR
        let q = 100;
        let p = 300;

        console.log(q<p && p==q);
        console.log(p>q && p!=q);
        console.log(p>q && p==false);
        console.log(p == null && p >q);

        // NOT(!) OPERATOR

        console.log(q!=p);
        console.log(!(q==p) && q<p);
        console.log(q*20 > p);

        // ASSIGNMENT OPERATOR
        let u = 50;
        let v = 20;

        console.log(u=u+v);
        console.log(u+=v);
        console.log(u=u-v);
        console.log(u-=v);
        console.log(u=u*v);
        console.log(u*=v);

        // TERNARY OPERATOR
        let x = 100;
        let y = 200;
        let big = y > x ? y : x;
        console.log(big);
        
        let small = x< y ? x : y;
        console.log(small);
        
        
    </script>
</body>
</html>
