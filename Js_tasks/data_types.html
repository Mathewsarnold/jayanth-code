<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // DATATYPES
        // PRIMIMTIVE

        // STRING
        let a = "Hi I am a string";
        console.log(a);
        console.log(typeof a);
        
        // NUMBER
        let b = 30;
        console.log(b);
        console.log(typeof b);

        // BOOLEAN
        let c = true;
        console.log(c);
        console.log(typeof c);

        // BIGINT
        let d = 30n;
        console.log(d);
        console.log(typeof d);
        
        // UNDEFINED
        let e = undefined;
        console.log(e);
        console.log(typeof e);

        // NULL
        let f = null;
        console.log(f);
        console.log(typeof f);

        // SYMBOL
        let g = Symbol();
        console.log(g);
        console.log(typeof g);

    // NON PRIMITIVE
        // ARRAY
        let h = [1,2,3,4,5];
        console.log(h);
        console.log(typeof h);

        // OBJECT
        let i = {name: 'jayanth', city: "chennai"};
        console.log(i);
        console.log(typeof i);
        
    </script>
</body>
</html>
