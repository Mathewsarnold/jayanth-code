<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // FOR loop
        for(let i=10; i<=14; i++){
            console.log(i, `${i}`);
            
        }

        // WHILE loop
        let a = 23;
        while(a<=27){
            console.log(a, `${a}`);
            a++
        }

        // DO WHILE loop
        let b = 3;
        do{
            console.log(b, `${b}`);
            b++;
            console.log(b, `${b}`);
        } while (b<=5)
    </script>
</body>
</html>
